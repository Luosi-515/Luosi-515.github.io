<script>
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var items=document.getElementById("data").textContent.split("\n").map(function(l){return l.trim()}).filter(Boolean).map(function(l){
  var a=l.split("|");return {cat:(a[0]||"其他").trim(),name:(a[1]||"").trim(),price:(a[2]||"").trim(),desc:(a[3]||"").trim()}
}).filter(function(p){return p.name});
var cats=[];items.forEach(function(p){if(cats.indexOf(p.cat)<0)cats.push(p.cat)});
document.getElementById("menu").innerHTML=cats.map(function(c,i){
  return '<section id="c'+i+'"><h2>'+esc(c)+'</h2><div class="list">'+items.filter(function(p){return p.cat===c}).map(function(p){
    return '<div class="item"><div><div class="name">'+esc(p.name)+'</div>'+(p.desc?'<div class="desc">'+esc(p.desc)+'</div>':'')+'</div><div class="price">'+(/^\d/.test(p.price)?'NT$ ':'')+esc(p.price)+'</div></div>'}).join("")+'</div></section>'}).join("");
var chips=document.getElementById("chips");
chips.innerHTML=cats.map(function(c,i){return '<button class="chip" data-i="'+i+'">'+esc(c)+'</button>'}).join("");
Array.prototype.forEach.call(chips.children,function(b){b.onclick=function(){
  var el=document.getElementById("c"+b.getAttribute("data-i"));if(el)el.scrollIntoView({behavior:"smooth"});
  Array.prototype.forEach.call(chips.children,function(x){x.classList.remove("on")});b.classList.add("on")}});
</script>
